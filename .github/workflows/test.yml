name: Check and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install MoonBit on Unix
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install MoonBit on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$HOME/.moon/bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Show stable toolchain
        run: moon version --all
      - name: Update package metadata
        run: moon update
      - name: Check formatting
        run: moon fmt --check
      - name: Check without warnings
        run: moon check --deny-warn --fmt
      - name: Run tests without warnings
        run: moon test --deny-warn
      - name: Refresh generated interfaces
        run: moon info
      - name: Ensure generated interfaces are committed
        run: git diff --exit-code
      - name: Build core native and full wasm targets
        run: |
          moon build --target native src/abc
          moon build --target wasm-gc
      - name: Verify source scale
        shell: pwsh
        run: ./tools/count_moonbit_lines.ps1 -RequireMinimum 7000
      - name: Run CLI and boundary fixtures
        run: |
          moon run cmd/abc --target wasm-gc check examples/demo.abc
          moon run cmd/abc --target wasm-gc analyze fixtures/abc/benchmark-medium.abc
          ! moon run cmd/abc --target wasm-gc format-check fixtures/abc/boundary-lines.abc
          moon run cmd/abc --target wasm-gc benchmark fixtures/abc/benchmark-large.abc
          ! moon run cmd/abc --target wasm-gc check fixtures/abc/boundary-empty.abc
          ! moon run cmd/abc --target wasm-gc check examples/invalid.abc
